---
# Required fields for packaging the application
# See https://docs.nvidia.com/holoscan/sdk-user-guide/cli/run_config.html#
application:
  title: Holohub - Endoscopy Tool Tracking
  version: 1.0
  inputFormats: []
  outputFormats: ["screen"]

resources:
  cpu: 2
  gpu: 1
  memory: 1Gi
  gpuMemory: 1Gi

extensions:
  - lib/gxf_extensions/libgxf_lstm_tensor_rt_inference.so
# Uncomment the following extension when using deltacast as a source
#  - lib/gxf_extensions/libgxf_videomaster.so
# Uncomment the following extension when using yuan as source
#  - lib/gxf_extensions/libgxf_qcap_source.so

# Scheduler configuration
scheduler: greedy  # event_based, multi_thread or greedy

greedy_scheduler:
  stop_on_deadlock: true
  stop_on_deadlock_timeout: 500

multi_thread_scheduler:
  worker_thread_number: 5
  stop_on_deadlock: true
  stop_on_deadlock_timeout: 500

event_based_scheduler:
  worker_thread_number: 5
  stop_on_deadlock: true
  stop_on_deadlock_timeout: 500

postprocessor: "tool_tracking_postprocessor" # "slang_shader" or "tool_tracking_postprocessor"

aja:
  channels: [NTV2_CHANNEL1, NTV2_CHANNEL2]
  overlay_channels: [NTV2_CHANNEL3, NTV2_CHANNEL4]
  width: 1920
  height: 1080
  framerate: 60
  overlay_rdma: true
  rdma: true
  enable_overlay: true

format_converter_aja:
  in_dtype: "rgba8888"
  out_tensor_name: source_video
  out_dtype: "float32"
  scale_min: 0.0
  scale_max: 255.0
  resize_width: 854
  resize_height: 480

lstm_inference:
  input_tensor_names:
    - source_video
    - cellstate_in
    - hiddenstate_in
  input_state_tensor_names:
    - cellstate_in
    - hiddenstate_in
  input_binding_names:
    - data_ph:0 # (shape=[1, 480, 854, 3], dtype=float32) <==> source_video
    - cellstate_ph:0 # (shape=[1, 60, 107, 7], dtype=float32) == internal state
    - hiddenstate_ph:0 # (shape=[1, 60, 107, 7], dtype=float32) == internal state
  output_tensor_names:
    - cellstate_out
    - hiddenstate_out
    - probs
    - scaled_coords
    - binary_masks
  output_state_tensor_names:
    - cellstate_out
    - hiddenstate_out
  output_binding_names:
    - Model/net_states:0 # (shape=[ 1, 60, 107, 7], dtype=float32)
    - Model/net_hidden:0 # (shape=[ 1, 60, 107, 7], dtype=float32)
    - probs:0 # (shape=[1, 7], dtype=float32)
    - Localize/scaled_coords:0 # (shape=[1, 7, 2], dtype=float32)
    - Localize_1/binary_masks:0 # (shape=[1, 7, 60, 107], dtype=float32)
  force_engine_update: false
  verbose: true
  max_workspace_size: 2147483648
  enable_fp16_: true

holoviz:
  tensors:
    - name: ""
      type: color
      opacity: 1.0
      priority: 0
    - name: mask
      type: color
      opacity: 1.0
      priority: 1
    - name: scaled_coords
      type: crosses
      opacity: 1.0
      line_width: 4
      color: [1.0, 0.0, 0.0, 1.0]
      priority: 2
    - name: scaled_coords
      type: text
      opacity: 1.0
      priority: 3
      color: [1.0, 1.0, 1.0, 0.9]
      text:
        - Grasper
        - Bipolar
        - Hook
        - Scissors
        - Clipper
        - Irrigator
        - Spec.Bag
  headless: false

holoviz_overlay:
  headless: true
  tensors:
    - name: mask
      type: color
      opacity: 1.0
      priority: 1
    - name: scaled_coords
      type: crosses
      opacity: 1.0
      line_width: 4
      color: [1.0, 0.0, 0.0, 1.0]
      priority: 2
    - name: scaled_coords
      type: text
      opacity: 1.0
      priority: 3
      color: [1.0, 1.0, 1.0, 0.9]
      text:
        - Grasper
        - Bipolar
        - Hook
        - Scissors
        - Clipper
        - Irrigator
        - Spec.Bag
        
# operators for SR
drop_alpha:
  in_dtype: "rgba8888"
  out_dtype: "rgb888"

inference_preprocessor:
  in_dtype: "rgb888"
  resize_width: 1920
  resize_height: 1088
  out_tensor_name: INPUT__0
  out_dtype: "float32"
  scale_min: -1
  scale_max: 1
  out_channel_order: [0,1,2]

sr_inference:
  model_path_map:
    "sr": "/workspace/holohub/data/sr/model_1080p-4k.engine"
  backend: "trt"
  pre_processor_map:
    "sr": ["INPUT__0"]
  inference_map:
    "sr": ["OUTPUT__0"]
  in_tensor_names: ["INPUT__0"]
  out_tensor_names: ["OUTPUT__0"]
  device_map:
    "sr": "0"
  input_on_cuda: true
  is_engine_path: true
  enable_fp16: true

inference_postprocessor:
  in_dtype: "float32"
  in_tensor_name: OUTPUT__0
  out_tensor_name: ""
  out_dtype: "rgb888"
  scale_min: -1
  scale_max: 1

holoviz_sr:
  width: 3840
  height: 2160
  tensors:
    - name: ""
      type: color
      opacity: 1.0
      priority: 0

recorder_resize:
  in_dtype: "rgb888"
  out_dtype: "rgb888"
  in_tensor_name: ""
  out_tensor_name: "output_video"
  resize_width: 3840
  resize_height: 2160

recorder:
  directory: "/workspace/holohub/outputs"
  basename: "sr_demo_output"